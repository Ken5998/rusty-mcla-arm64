name: Release

# Publishes release vVERSION (the version in launcher/Cargo.toml) with the
# launcher, the ARM64 build of the game (Rusty MCLA at upstream.json's commit
# with patches/, its install tool and the artwork tool) and the patched source
# the build is made from. No game files: on the device the launcher builds the
# game data from the player's own disc.

on:
  workflow_dispatch:
  # The weekly upstream check (upstream-check.yml) releases what it merged.
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Install Rust and the build libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends cmake pkg-config libasound2-dev libudev-dev
          command -v rustup || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rust="$(python3 -c 'import json; print(json.load(open("upstream.json"))["rust"])')"
          "$HOME/.cargo/bin/rustup" toolchain install "$rust" --profile minimal
          "$HOME/.cargo/bin/rustup" toolchain install stable --profile minimal
          echo "MCLA_RUST=$rust" >> "$GITHUB_ENV"
      - name: Build the game and the launcher
        run: |
          RUSTUP_TOOLCHAIN="$MCLA_RUST" scripts/build-game.sh out
          scripts/package-launcher.sh out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -1)"
          upstream="$(python3 -c 'import json; print(json.load(open("upstream.json"))["version"])')"
          files=(out/RustyMCLA-Launcher-linux-arm64.tar.gz out/RustyMCLA-game-linux-arm64.tar.gz out/RustyMCLA-source.tar.gz)
          sha256="$(sha256sum out/RustyMCLA-Launcher-linux-arm64.tar.gz | cut -d' ' -f1)"
          scripts/release-notes.sh "v$version" > notes.md
          cat >> notes.md <<NOTES
          ## Hitting the streets of LA

          Launcher $version comes with [Rusty MCLA $upstream](https://github.com/holdmysocks/rusty-mcla), the open source Midnight Club: Los Angeles engine, already compiled for ARM64 (RustyMCLA-game-linux-arm64.tar.gz; the launcher downloads it for you).

          1. In Desktop Mode, unpack RustyMCLA-Launcher-linux-arm64.tar.gz and start RustyMCLA/rusty-mcla-launcher.
          2. Point it at your Xbox 360 ISO of Midnight Club: Los Angeles, Complete Edition, pick resolution, frame cap and render scale, and press **Install**. The game data is built from the disc: about 16 GB free, on the charger.
          3. Play from Steam. The entry has no artwork: set it with SteamGridDB, and later updates keep it.

          1280 x 720 capped at 60 fps is the default; Shadows are the first setting to lower if the city drops frames. New Rusty MCLA versions land here every week or so, and **Update** picks them up.

          RustyMCLA-source.tar.gz is the exact source of this build (GPL-3.0). Launcher SHA-256: \`$sha256\`; no game data included.
          NOTES
          if gh release view "v$version" > /dev/null 2>&1; then
            gh release upload "v$version" "${files[@]}" --clobber
            gh release edit "v$version" --notes-file notes.md
          else
            gh release create "v$version" "${files[@]}" --title "Midnight Club: Los Angeles $version for ARM64 Linux" \
              --notes-file notes.md --target "$(git rev-parse HEAD)"
          fi
