name: Shader stats

# Throwaway diagnostics: builds the city pipeline from shader-stats/*.wgsl with
# Turnip (Mesa's Adreno Vulkan driver, as on the Retroid Pocket 6) running on
# Mesa's drm-shim, which pretends to be an Adreno 740, and prints what the
# Adreno compiler (ir3) made of the vertex and fragment programs.

on:
  push:
    branches: ['ci/shader-stats']
  workflow_dispatch:

permissions:
  contents: read

env:
  MESA_REF: mesa-26.2.4
  CARGO_TERM_COLOR: never

jobs:
  stats:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build bison flex python3-mako python3-yaml python3-ply \
            libdrm-dev libexpat1-dev zlib1g-dev libzstd-dev libelf-dev glslang-tools pkg-config libvulkan1 libvulkan-dev
          pip install --user --break-system-packages 'meson>=1.4'
      - uses: actions/cache@v4
        id: mesa
        with:
          path: turnip
          key: turnip-shim-${{ env.MESA_REF }}-v1
      - name: Build Turnip and the drm-shim
        if: steps.mesa.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://gitlab.freedesktop.org/mesa/mesa/-/archive/$MESA_REF/mesa-$MESA_REF.tar.gz" | tar -xz
          cd "mesa-$MESA_REF"
          grep -n "getenv" src/freedreno/drm-shim/*.c | head
          meson setup build -Dvulkan-drivers=freedreno -Dgallium-drivers= -Dfreedreno-kmds=msm -Dtools=drm-shim \
            -Dplatforms= -Dopengl=false -Dllvm=disabled -Dglx=disabled -Degl=disabled -Dgbm=disabled -Dgles1=disabled -Dgles2=disabled \
            -Dvideo-codecs= -Dvalgrind=disabled -Dlibunwind=disabled -Dbuildtype=release > ../meson.log 2>&1 || { tail -60 ../meson.log; exit 1; }
          ninja -C build > ../ninja.log 2>&1 || { tail -40 ../ninja.log; exit 1; }
          mkdir -p ../turnip
          cp build/src/freedreno/vulkan/libvulkan_freedreno.so build/src/freedreno/drm-shim/libfreedreno_noop_drm_shim.so ../turnip/
          ls ../turnip
      - name: Build the harness
        run: cargo build --release --manifest-path tools/shader-stats/Cargo.toml
      - name: Compile and report
        run: |
          t="$PWD/turnip"
          printf '{"file_format_version":"1.0.0","ICD":{"library_path":"%s/libvulkan_freedreno.so","api_version":"1.4.0"}}\n' "$t" > "$t/icd.json"
          export VK_ICD_FILENAMES="$t/icd.json" VK_DRIVER_FILES="$t/icd.json"
          export LD_PRELOAD="$t/libfreedreno_noop_drm_shim.so" FD_GPU_ID=740 FD_CHIP_ID=0x43050a01
          export IR3_SHADER_DEBUG=disasm RUST_LOG=warn
          mkdir -p out
          for f in shader-stats/*.wgsl; do
            n="$(basename "$f" .wgsl)"
            timeout 900 tools/shader-stats/target/release/shader-stats "$f" > "out/$n.txt" 2> "out/$n.err" || echo "($n: exit $?)"
            echo "=================== $n"
            tail -1 "out/$n.err"
            grep -E "prog [0-9]+/[0-9]+:|spill|fill|max_reg|waves|threadsize" "out/$n.err" | sed 's/^MESA: info: //' | sort | uniq | head -40
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shader-stats
          path: out/
